<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>KEI - Mileage</title>
<style>
/* Build 6 (2026-11-13): Rory - "very, very slick", "most importantly minimal", like the Two-Peg Test.
   One column, no cards, one button. Same look as the Two-Peg Test app. */
:root{
  --bg:#f2f4f5; --paper:#ffffff; --ink:#14191c; --ink-2:#5b686e; --line:#c3ccd0;
  --accent:#0f4c5c; --accent-ink:#ffffff;
  --ok-bg:#c6efce; --ok-ink:#006100; --warn-bg:#ffeb9c; --warn-ink:#9c5700;
  --bad-bg:#ffc7ce; --bad-ink:#9c0006;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1214; --paper:#151d20; --ink:#e7eef0; --ink-2:#93a3a9; --line:#334247;
  --accent:#4fb3c9; --accent-ink:#06181d;
  --ok-bg:#123420; --ok-ink:#7fe3a2; --warn-bg:#3c3113; --warn-ink:#f3cd68;
  --bad-bg:#40171b; --bad-ink:#ff97a2;
}}
@media (prefers-color-scheme:dark){.logo .navy{fill:#ffffff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
main{max-width:420px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;align-items:center;gap:12px}
.top .logo{flex:0 0 auto}
.top .t{flex:1 1 auto;min-width:0}
h1{font-size:24px;margin:0 0 1px}
.sub{margin:0;color:var(--ink-2);font-size:14px}
#syncPill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;
  background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
#syncPill.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
#syncPill.dirty{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
#syncPill.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
label,.lab{display:block;font-size:13px;color:var(--ink-2);margin-top:16px}
input,textarea,select{width:100%;min-width:0;margin-top:3px;padding:10px;font:16px var(--sans);color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:6px}
textarea{resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.odo{font:20px var(--mono)}
.pair{display:flex;gap:12px}
.pair>div{flex:1 1 0;min-width:0}
.with{display:flex;gap:6px;margin-top:3px}
.with input{margin-top:0}
/* build 8: compact - one line, but the km stay visible so the dash can be cross-checked */
.uselast{display:inline-block;margin-top:14px;padding:6px 12px;font:600 14px var(--sans);
  color:var(--accent);background:var(--paper);border:1px solid var(--accent);border-radius:999px;cursor:pointer}
.uselast span{font-weight:400;color:var(--ink-2)}
.hint{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.hint a,.links button,a.lk{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
/* client type-ahead: nothing shows until you type */
.sugg{margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;padding:11px 12px;font:16px var(--sans);color:var(--ink);
  background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:active,.sugg button:focus{background:var(--bg);outline:none}
.sugg small{color:var(--ink-2)}
input.picked{border-color:var(--accent);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font:600 14px var(--sans);color:var(--ink-2);
  background:var(--paper);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go{display:block;width:100%;margin-top:20px;padding:14px;font:650 17px var(--sans);color:var(--accent-ink);
  background:var(--accent);border:0;border-radius:8px;cursor:pointer}
.go:active{transform:translateY(1px)}
.links{margin:12px 0 0;font-size:14px;color:var(--ink-2)}
.shot{display:flex;gap:8px;align-items:center;margin-top:6px}
.shot img{width:84px;height:63px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.shot .meta{font-size:12px;color:var(--ink-2)}
.shot .btn{font:inherit;font-size:12px;color:var(--bad-ink);background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
/* the open trip */
.card.live{margin-top:18px;padding:14px;border-radius:8px;background:var(--paper);border:2px solid var(--accent)}
.card.live h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.card.live h2 .n{display:none}
.card.live .stack{display:flex;gap:16px;margin-top:10px}
.card.live .stack .btn{font:inherit;font-size:14px;color:var(--accent);background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
.card.live .stack .btn.danger{color:var(--bad-ink)}
.dist{display:flex;align-items:baseline;gap:6px;justify-content:center;margin-top:10px;padding:10px;border-radius:8px;background:var(--bg)}
.dist .v{font:700 32px/1 var(--mono)} .dist .u{color:var(--ink-2);font-size:14px}
.dist.bad{background:var(--bad-bg)} .dist.bad .v{color:var(--bad-ink)}
#noStart.card{margin-top:10px}
/* waiting + sent */
.list{margin-top:22px}
.list h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px}
.row{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .m{flex:1 1 auto;min-width:0}
.row .k{font:600 14px var(--mono);white-space:nowrap}
.row .why{display:block;font-size:12px;color:var(--ink-2)}
.row .why.bad{color:var(--bad-ink)}
.row .act{white-space:nowrap;font-size:13px}
.row .act button{font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;padding:0 0 0 8px;cursor:pointer}
.row .act button.danger{color:var(--bad-ink)}
.ok-ink{color:var(--ok-ink)}
/* banners only when something needs you */
.banner{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;background:var(--paper);border:1px solid var(--line)}
.banner b{display:block;margin-bottom:2px}
.banner.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.banner.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.banner .btn{margin-top:8px;font:600 14px var(--sans);padding:7px 12px;border-radius:6px;border:1px solid currentColor;
  background:transparent;color:inherit;cursor:pointer}
#installBanner{display:flex;gap:10px;align-items:center}
#installMsg b{display:inline;margin:0}
.foot{margin:26px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6}
.foot .btn{font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
.foot .go{margin-top:8px;font-size:15px;padding:11px}
.hidden{display:none !important}
#updatePill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;padding:11px 18px;
  font:650 15px var(--sans);color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:16px;
  max-width:420px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .row{display:flex;gap:10px;border:0}
dialog .row>div{flex:1}
dialog .f{margin-top:10px}
dialog label{margin-top:0}
.dlgbtns{display:flex;gap:10px;margin-top:14px}
.dlgbtns button{flex:1;padding:11px;font:600 15px var(--sans);border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer}
.dlgbtns .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#pill{display:none}
</style>
</head>

<main>
<header class="top">

18.28-34.24,1.9-3.58,3.69-7.22,5.53-10.83-.53,.25-1.12,.42-1.56,.77-14.47,11.62-28.91,23.26-43.37,34.89-2.25,1.81-4.54,3.58-7.31,5.77,1.4-10.41,2.73-20.2,4.1-30.41-17.18,14.18-34.03,28.1-50.89,42.03-.16-.15-.32-.3-.48-.44,14.25-21.83,28.49-43.66,42.83-65.63,6.89,4.37,13.45,8.52,20.35,12.89,1.74-19.64,3.43-38.79,5.14-58.11C115.7,334.85,58.29,392.37,.97,449.8H172.91c21.74-21.76,43.18-43.23,64.65-64.73-25.16,10.57-50.37,21.16-75.58,31.75Zm-72.92,17.75l-9.12-13.22-1.9,2.39v10.83h-8.05v-34.15h8.05v13.56l10.29-13.56h8.73l-11.76,15.27,13.32,18.88h-9.56Zm33.85-28h-12.73v7.66h11.71v6.1h-11.71v7.95h12.73v6.29h-21.27v-34.15h21.27v6.15Zm21.35-.05h-4.39v21.9h4.39v6.15h-17.27v-6.15h4.34v-21.9h-4.34v-6.1h17.27v6.1Z"/><path fill="#02374c" class="navy" d="M204.66,335.2s-.02,.04-.03,.06c.02-.01,.04-.02,.07-.03l-.04-.03Z"/></g></g></svg>
<div class="t"><h1>Mileage</h1>
<p class="sub">Trips go to the office by themselves.</p></div>
<span id="syncPill">&nbsp;</span>
</header>
<span id="pill"></span>

<div class="banner warn hidden" id="installBanner">
  <div id="installMsg" style="flex:1 1 auto"></div>
  <button class="btn hidden" id="installBtn" type="button">Install</button>
</div>
<div id="banners"></div>

<!-- the trip in progress: only when there is one -->
<section id="openCard" class="card live hidden">
  <h2><span class="n">&#9679;</span> Trip in progress</h2>
  <div id="openHead"></div>
  <label for="oNotes">Where you went</label>
  <textarea id="oNotes" rows="2"></textarea>
  <label for="endKm">End odometer (km)</label>
  <input type="text" id="endKm" class="odo" inputmode="decimal" autocomplete="off">
  <div class="shot hidden" id="endShot"></div>
  <div class="dist" id="oDist"><span class="v">&mdash;</span><span class="u">km</span></div>
  <p class="hint" id="oDistHint"></p>
  <button class="go" id="endBtn" type="button">End trip</button>
  <div class="stack">
    <button class="btn" id="editOpenBtn" type="button">Edit trip</button>
    <button class="btn danger" id="binOpenBtn" type="button">Discard trip</button>
  </div>
</section>
<div id="noStart" class="hidden"></div>

<!-- a new trip -->
<section id="startCard">
  <label for="sProj">Client</label>
  <input type="text" id="sProj" placeholder="Start typing &mdash; CoN, LLC, SIFCo&hellip;" autocomplete="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="next">
  <div class="sugg hidden" id="projList"></div>

  <span class="lab">Vehicle</span>
  <div class="chips" id="vehChips"></div>

  <label for="sNotes">Where</label>
  <textarea id="sNotes" rows="1" placeholder="e.g. Selous and Anderson"></textarea>

  <!-- build 7: the last reading is a real button, above the start box (Rory: "a little bit bigger") -->
  <button class="uselast hidden" id="useLastBtn" type="button"></button>
  <div class="pair">
    <div>
      <label for="startKm">Start km</label>
      <input type="text" id="startKm" class="odo" inputmode="decimal" autocomplete="off">
    </div>
    <div>
      <label for="sEndKm">End km</label>
      <input type="text" id="sEndKm" class="odo" inputmode="decimal" placeholder="later" autocomplete="off">
    </div>
  </div>
  <div class="shot hidden" id="startShot"></div>
  <div class="shot hidden" id="sEndShot"></div>

  <p class="hint" id="dateLine"></p>
  <input type="text" id="sDate" class="hidden" inputmode="numeric" placeholder="yyyy-mm-dd" maxlength="10" autocomplete="off">

  <button class="go" id="startBtn" type="button">Start trip</button>
</section>

<section class="list hidden" id="waitBox">
  <h3>Waiting to send</h3>
  <div id="waitList"></div>
</section>
<section class="list hidden" id="recentBox">
  <h3>Sent to the office</h3>
  <div id="recent"></div>
</section>

<footer class="foot">
  <div id="syncState"></div>
  <button class="go" id="signInBtn" type="button">Sign in with Microsoft</button>
  <div class="links">
    <button class="btn" id="syncNowBtn" type="button">Sync now</button>
    &middot; <button class="btn" id="signOutBtn" type="button">Sign out</button>
  </div>
  <div style="margin-top:10px">Kootenay Environmental Innovations &middot; <span id="buildBadge">build</span></div>
</footer>
</main>

<button id="updatePill" class="hidden" type="button">Updated &mdash; tap to reload</button>

  <div class="dlgbtns">
    <button id="dlgCancel" type="button">Cancel</button>
    <button class="pri" id="dlgOk" type="button">Save</button>
  </div>
</dialog>

<script>
"use strict";
/* Build 6. Bump BUILD and sw.js's CACHE together on every release (deploy.ps1 refuses otherwise). */
var BUILD="10";

/* ------------------------------------------------------------------ projects
   These are the EXACT project strings from
   _Profitability Dashboard\data\mileage_rates.json. They must stay exact:
   the invoicing engine looks the rate up by string match, and a near-miss
   ("LLC_GW (2026)" vs "LLC_GW (2026 Program)") silently prices at the default
   rate. Add a project here when it is added to mileage_rates.json.
   No dollar figure is calculated in this app on purpose - pricing belongs to
   one engine (tools\calc.py), and a rate table baked into a phone goes stale
   without anyone noticing. */
var PROJECTS=[
  {p:"LLC_SFM (2026 Program)",           g:"client"},
  {p:"CoN_SFM (2026)",                   g:"client"},
  {p:"CoN_IH Reporting (2026 Program)",  g:"client"},
  {p:"CoN_City Snow Level Monitoring",   g:"client"},
  {p:"CoN_Selous Repair",                g:"client"},
  {p:"CoN_5-Mile Repair Monitoring",     g:"client"},
  {p:"LLC_GW (2026 Program)",            g:"client"},
  {p:"SIFCo_SFM (2026)",                 g:"client"},
  {p:"HPWPS_SFM (2026 Program)",         g:"client"},
  {p:"RDKB_Topping & Beaver SFM (2025-26)", g:"client"},
  {p:"SIFCo_Alba (2024-26)",             g:"client"},
  {p:"Tsenbo_SFM (2024-26)",             g:"client"},
  {p:"CoC_GC Install",                   g:"client"},
  {p:"000_KEI",                          g:"kei"},
  {p:"000_Admin",                        g:"kei"},
  {p:"000_Personal",                     g:"kei"},
  {p:"000_House",                        g:"kei"},
  {p:"000_Rental",                       g:"kei"},
  {p:"CoN_SFM (2025)",                   g:"old"},
  {p:"CoN_IH Reporting (2026)",          g:"old"},
  {p:"HPWPS_SFM (2025 Program)",         g:"old"},
  {p:"LLC_SFM (2025 Program)",           g:"old"}
];

/* Vehicles, exact strings from mileage_rates.json "vehicles". The dashboard
   REFUSES a trip against an unknown vehicle rather than guessing its rate. */
var VEHICLES=["RAV4","CRV","Crosstrek","Allie's Rav4","IBEX 450"];

/* Site chips were removed on Rory's request (2026-09-01, build 3) - notes are
   free text only. If they ever come back, builds 1-2 in _Superseded and git
   history carry the SITES list, sitePrefix() and drawSiteChips(). */

var STORE="kei-mileage-v1";
var PHOTO_PREFIX="kei-mileage-photo-";
var PHOTO_MAX_EDGE=1024;      /* an odometer only has to be legible, not printable */
var PHOTO_QUALITY=0.6;
var STORE_WARN=2500000;       /* shout well before the ~5 MB localStorage wall */

var $=function(id){ return document.getElementById(id); };
var RECORD=false;             /* build 6 has no sent-file view; kept so shared code reads the same */
var S=null;
var storageOK=true, storageErr="";
var draft={proj:"", veh:"", photo:null, endPhoto:null};
var endPhoto=null;
var dateOpen=false;

/* ================================================================ OFFICE SYNC
   Build 5 (2026-11-12). Trips go to the SharePoint list "Mileage Trips" on the
   KEI Tasks site whenever the app is open with signal. A weekday job on the
   office PC turns that list into the Mileage tool on the website's Internal Tools.

   Rules, all load-bearing:
   - A trip is marked Synced ONLY after its office row is read back and matches,
     field by field, at the same edit number (Rev). A send that merely LOOKED
     fine never clears a trip.
   - TripId = device id + trip id + a random tag, and the list enforces it as
     UNIQUE, so a retry, a double tap or two phones can never double a trip.
   - Every edit bumps Rev; anything with Rev above what the office confirmed is
     sent again. Deletes become State=deleted on the office row (a tombstone),
     never a silently vanished trip.
   - Same Microsoft app and sign-in code as the task board. The sign-in is the
     person's own: what they can write is decided by SharePoint, not this file.
   Nothing in MS below is a secret - a public client has no secret by design. */
var MS={
  tenantId:"ff85c429-ed5b-458f-aca2-478fd1f538e1",
  clientId:"d6fb3bfc-b421-4d95-b7b3-f3cce4dad884",
  siteId:"kootenayenv.sharepoint.com,d6190ecd-1fad-4ef0-9fcc-eebca2ff6a06,6f9302de-fdc0-42da-a9dd-a48c907c14a5",
  trips:"34b49ecb-fc6a-4bf4-8a69-c8d6839670f8",
  devices:"0734d98e-8106-4047-9e78-b11daee26de6"
};
var GRAPH="https://graph.microsoft.com/v1.0";

function newUid(bytes){

var AUTH=(function(){

      redirect_uri:redirectUri(),code_verifier:v,scope:SCOPES}).then(function(tok){
      var back=""; try{ back=sessionStorage.getItem(RKEY)||""; sessionStorage.removeItem(VKEY); sessionStorage.removeItem(RKEY); }catch(e){}

    refreshing=form(AUTHORITY+"/token",{client_id:MS.clientId,grant_type:"refresh_token",

var SYNC=(function(){

      var v=r.value||[];

  function upsert(list,keyField,keyValue,knownId,fields,check,revGuard){

      if(revGuard===undefined||revGuard===null) return doPatch(id);

  }

    var f={Title:S.deviceId,DeviceId:S.deviceId,Driver:(S.driver||who.name||"").trim(),SignedInAs:who.email||"",
      AppBuild:BUILD,Platform:platform(),LastSync:nowISO(),Pending:pending(),OpenTrips:open};
    return upsert(MS.devices,"DeviceId",S.deviceId,S.deviceSpId,f,{DeviceId:S.deviceId,LastSync:f.LastSync})
      .then(function(id){ if(S!==runS) return; S.deviceSpId=id; S.lastBeat=Date.now(); S.beatErr=""; save(true); },

      save(true);

  return {run:run, soon:soon, pending:pending, needs:needs, tripId:tripId,
          state:function(){ return last; }, busy:function(){ return busy; }};
})();

/* A trip the office has confirmed (read back, at its latest edit) and that is closed has nothing
   left to do on the phone, so it comes off it (Rory, 2026-11-13: "once a trip is synced onto the
   website, I want it to automatically come off this phone"). What stays: the vehicle's last reading
   (for the start-km hint) and a short "Sent to the office" line. Open trips stay until closed. */
function retire(t){
  S.lastKm=S.lastKm||{};
  if(t.end_km!==null&&t.end_km!==undefined&&t.start_km>0) S.lastKm[t.vehicle]={km:t.end_km,date:t.date};
  S.recent=Array.isArray(S.recent)?S.recent:[];
  S.recent.unshift({date:t.date,project:t.project,vehicle:t.vehicle,km:tripKm(t),at:nowISO()});
  S.recent=S.recent.slice(0,5);
  dropPhoto(t.id,"start"); dropPhoto(t.id,"end");
  S.trips=S.trips.filter(function(x){ return x.id!==t.id; });
}
function retireSynced(){
  /* a build-5 phone may still hold trips the office already has */
  S.trips.filter(function(t){ return (t.syncRev||0)>0&&!SYNC.needs(t)&&t.end_km!==null&&t.end_km!==undefined; })
    .forEach(retire);
}

function drawSync(){
  if(!$("syncState")) return;
  var n=SYNC.pending(), st=SYNC.state(), who=AUTH.signedIn()?AUTH.who():null;
  var sp=$("syncPill"), line="";
  if(!HOSTED){
    line="Syncing works only in the installed app, not in a copied file.";
    sp.textContent="No sync"; sp.className="";
  }else if(!who){
    line=n?n+" trip"+(n>1?"s are":" is")+" waiting to reach the office.":"Sign in once and trips go to the office by themselves.";
    sp.textContent=n?n+" not synced":"Sign in"; sp.className=n?"bad":"";
  }else if(st.state==="syncing"){
    line="Sending&hellip;"; sp.textContent="Syncing"; sp.className="dirty";
  }else if(!navigator.onLine||st.state==="offline"){
    line=n?"No signal &mdash; "+n+" trip"+(n>1?"s":"")+" will go the moment there is.":"No signal &mdash; nothing waiting.";
    sp.textContent=n?n+" waiting":"Synced"; sp.className=n?"dirty":"ok";
  }else if(S.lastSyncErr){
    line="Sync problem: "+esc(S.lastSyncErr);
    sp.textContent="Sync problem"; sp.className="bad";
  }else if(n){
    line=n+" trip"+(n>1?"s":"")+" waiting to sync."; sp.textContent=n+" waiting"; sp.className="dirty";
  }else{
    line="Everything is at the office."; sp.textContent="Synced"; sp.className="ok";
  }
  if(who) line+='<br>Signed in as '+esc(who.email||who.name)+
    (S.lastSync?' &middot; last sync '+esc(S.lastSync.slice(11,16)):"");
  $("syncState").innerHTML=line;
  $("signInBtn").classList.toggle("hidden",!!who||!HOSTED);
  $("syncNowBtn").classList.toggle("hidden",!who);
  $("signOutBtn").classList.toggle("hidden",!who);
  $("syncNowBtn").parentNode.classList.toggle("hidden",!who);
}
function touch(t){ t.rev=(t.rev||1)+1; }

/* ---------------------------------------------------------------- utilities */
function todayISO(){

  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

  var d=new Date(), p=function(n){ return (n<10?"0":"")+n; };
  var off=-d.getTimezoneOffset(), s=off<0?"-":"+"; off=Math.abs(off);
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+
         p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+
         s+p(Math.floor(off/60))+":"+p(off%60);
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function num(v){
  if(v===null||v===undefined) return null;
  var s=String(v).replace(/[,\s]/g,"");
  if(s==="") return null;
  if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
/* The date is typed, not picked: <input type=date> renders in the phone's locale
   (e.g. 09/01/2026) and Rory wants YYYY-MM-DD on screen (2026-09-01). Everything
   downstream - file names, mileage.json, the CSV - already stores ISO. */
function validDate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||"")) return false;
  var p=s.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getFullYear()===+p[0]&&d.getMonth()===+p[1]-1&&d.getDate()===+p[2];
}
function fmtKm(n){
  if(n===null||n===undefined||isNaN(n)) return "-";
  return (Math.round(n*10)/10).toLocaleString("en-CA",{maximumFractionDigits:1});
}
function dayName(iso){
  var p=String(iso).split("-");
  if(p.length!==3) return iso;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var mons=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()]+" "+d.getDate()+" "+mons[d.getMonth()];
}
function daysAgo(iso){
  var p=String(iso).split("-");
  if(p.length!==3) return 0;
  var a=new Date(+p[0],+p[1]-1,+p[2]);
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.round((t-a)/86400000);
}
function pill(text,cls){
  var el=$("pill");
  el.textContent=text; el.className="pill"+(cls?" "+cls:"");
}

/* ---------------------------------------------------------------- storage
   file:// origins can refuse localStorage outright, and a phone that silently
   forgets a trip is worse than one that never took it. Probe at boot and shout
   in a red banner rather than discovering it two weeks later. */
function probeStorage(){
  try{
    var k="kei-mileage-probe";
    localStorage.setItem(k,"1");
    if(localStorage.getItem(k)!=="1") throw new Error("read back wrong");
    localStorage.removeItem(k);
    storageOK=true;
  }catch(e){
    storageOK=false;
    storageErr=(e&&e.message)||String(e);
  }
  return storageOK;
}
/* NEEDS_SAVE: set when load() invents ids (a new device id, a trip's uid). They
   MUST be written before anything syncs - an id made up again on the next launch
   would put a second copy of the trip (or a second phone row) at the office
   (review, 2026-11-12). init() saves at once when this is set. */
var NEEDS_SAVE=false;
function blank(){
  NEEDS_SAVE=true;
  return {v:1, driver:"", vehicle:"", trips:[], seq:0, deviceId:newUid(8), tombs:[]};
}
/* Build 5 adds sync bookkeeping. Older trips get it here, once: a uid (part of
   the office key), rev 1, and syncRev 0 - so every existing trip syncs once. */
function migrate(s){
  if(!s.deviceId){ s.deviceId=newUid(8); NEEDS_SAVE=true; }
  if(!Array.isArray(s.tombs)) s.tombs=[];
  s.trips.forEach(function(t){
    if(!t.uid){ t.uid=newUid(4); NEEDS_SAVE=true; }
    if(typeof t.rev!=="number") t.rev=1;
    if(typeof t.syncRev!=="number") t.syncRev=0;
  });
  return s;
}
function load(){
  if(!storageOK) return blank();
  try{
    var raw=localStorage.getItem(STORE);
    if(!raw) return blank();
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.trips)) return blank();
    if(typeof s.seq!=="number") s.seq=s.trips.length;
    return migrate(s);
  }catch(e){ return blank(); }
}
var saveTimer=null;
function save(now){
  if(!storageOK){ pill("NOT SAVED","bad"); return false; }
  clearTimeout(saveTimer);
  if(!now){ pill("Saving...","dirty"); saveTimer=setTimeout(function(){ save(true); },400); return true; }
  try{
    localStorage.setItem(STORE,JSON.stringify(S));
    pill("Saved","ok");
    return true;
  }catch(e){
    pill("NOT SAVED","bad");
    banner("bad","Nothing could be saved",
      "The phone refused to store the trip log ("+esc((e&&e.name)||"error")+"). Free up space, "+
      "or send what you have now before you lose it.");
    return false;
  }
}
function photoKey(id,which){ return PHOTO_PREFIX+id+"-"+which; }
function putPhoto(id,which,dataURL){
  if(!storageOK||!dataURL) return false;
  try{ localStorage.setItem(photoKey(id,which),dataURL); return true; }
  catch(e){
    /* The trip itself is what matters. Keep it, lose the photo, say so out loud. */
    alert("The photo could not be stored - the phone is out of space.\n\n"+
          "The trip has been saved WITHOUT the photo. Send your trips to clear space.");
    return false;
  }
}
function getPhoto(id,which){
  if(!storageOK) return null;
  try{ return localStorage.getItem(photoKey(id,which)); }catch(e){ return null; }
}
function dropPhoto(id,which){
  try{ localStorage.removeItem(photoKey(id,which)); }catch(e){}
}
function storageUsed(){
  var n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf("kei-mileage")===0) n+=(localStorage.getItem(k)||"").length+k.length;
    }
  }catch(e){ return null; }
  return n;
}

/* ---------------------------------------------------------------- banners */
var extraBanners=[];
function banner(cls,title,body,action){
  extraBanners.push({cls:cls,title:title,body:body,action:action});
  drawBanners();
}
function drawBanners(){
  var out=[];
  if(!storageOK){
    out.push('<div class="banner bad"><b>This phone will not remember anything</b>'+
      'The browser refused to store data ('+esc(storageErr)+'). Trips typed here vanish when you '+
      'close the page. Open the file from a normal browser tab rather than a preview window, or '+
      'use another device - and tell Rory.</div>');
  }
  var open=S?S.trips.filter(function(t){ return t.end_km===null||t.end_km===undefined; }):[];
  var stale=open.filter(function(t){ return daysAgo(t.date)>=1; });
  if(stale.length){
    var names=stale.map(function(t){
      return dayName(t.date)+" - "+t.project+" ("+t.vehicle+")";
    }).join("<br>");
    out.push('<div class="banner bad"><b>'+stale.length+' trip'+(stale.length>1?"s have":" has")+
      ' no end odometer</b>'+names+'<br><br>An open trip cannot be invoiced - the office refuses to '+
      'bill a trip of unknown length. Read the odometer, or enter your best estimate and say so in '+
      'the notes.</div>');
  }
  if(S&&HOSTED&&!RECORD){
    var waiting=SYNC.pending();
    if(waiting&&!AUTH.signedIn()){
      out.push('<div class="banner warn"><b>'+waiting+' trip'+(waiting>1?"s haven't":" hasn't")+
        ' reached the office</b>Sign in with Microsoft once and they go by themselves.'+
        '<br><button class="btn sm" data-signin="1" type="button">Sign in</button></div>');
    }else if(S.lastSyncErr&&AUTH.signedIn()&&navigator.onLine){
      out.push('<div class="banner bad"><b>Trips are not reaching the office</b>'+esc(S.lastSyncErr)+
        '<br><button class="btn sm" data-syncnow="1" type="button">Try again</button></div>');
    }
  }
  var used=storageUsed();
  if(used!==null&&used>STORE_WARN){
    out.push('<div class="banner warn"><b>This phone is nearly full</b>'+
      'The mileage app is using '+Math.round(used/1024)+' KB and a phone usually allows about '+
      '5 MB. Sign in and let your trips send - they come off the phone once the office has them. '+
      'Until then the next odometer photo may not save.</div>');
  }
  for(var i=0;i<extraBanners.length;i++){
    var b=extraBanners[i];
    out.push('<div class="banner '+b.cls+'"><b>'+esc(b.title)+'</b>'+b.body+
      '<br><button class="btn sm" data-dismiss="'+i+'">Dismiss</button></div>');
  }
  $("banners").innerHTML=out.join("");
  Array.prototype.forEach.call($("banners").querySelectorAll("[data-signin]"),function(b){
    b.onclick=startSignIn;
  });
  Array.prototype.forEach.call($("banners").querySelectorAll("[data-syncnow]"),function(b){
    b.onclick=function(){ S.lastSyncErr=""; SYNC.run("button"); };
  });
  Array.prototype.forEach.call($("banners").querySelectorAll("[data-dismiss]"),function(b){
    b.onclick=function(){
      extraBanners.splice(+b.getAttribute("data-dismiss"),1);
      drawBanners();
    };
  });
}

/* ---------------------------------------------------------------- photos */
function shrink(file,cb){
  var reader=new FileReader();
  reader.onerror=function(){ alert("That image could not be read."); cb(null); };
  reader.onload=function(){
    var img=new Image();
    img.onerror=function(){ alert("That image could not be opened."); cb(null); };
    img.onload=function(){
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h){ cb(null); return; }
      var sc=Math.min(1,PHOTO_MAX_EDGE/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
      var c=document.createElement("canvas");
      c.width=cw; c.height=ch;
      c.getContext("2d").drawImage(img,0,0,cw,ch);
      try{ cb(c.toDataURL("image/jpeg",PHOTO_QUALITY)); }
      catch(e){ alert("That image could not be processed."); cb(null); }
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function showShot(el,dataURL,label,onClear){
  if(!dataURL){ el.className="shot hidden"; el.innerHTML=""; return; }
  el.className="shot";
  el.innerHTML='<img alt="Odometer photo" src="'+dataURL+'">'+
    '<div class="meta">'+esc(label)+'<br>'+Math.round(dataURL.length/1400)+' KB'+
    '<br><button class="btn sm danger" style="margin-top:6px">Remove</button></div>';
  el.querySelector("button").onclick=onClear;
}

/* ---------------------------------------------------------------- client type-ahead
   Nothing to scroll past: an empty box, and the matching projects appear as you type.
   The trip can only take a project picked from the list - the exact string the
   invoicing prices by (a near-miss would price at the default rate). */
function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function matches(q){
  var n=norm(q); if(!n) return [];
  var rank={client:0,kei:1,old:2};
  return PROJECTS.map(function(p){
    var k=norm(p.p), code=norm(p.p.split("_")[0]);
    var score=(code.indexOf(n)===0?0:(k.indexOf(n)===0?1:(k.indexOf(n)>=0?2:-1)));
    return {p:p, score:score};
  }).filter(function(x){ return x.score>=0; })
    .sort(function(a,b){ return (a.score-b.score)||(rank[a.p.g]-rank[b.p.g])||a.p.p.localeCompare(b.p.p); })
    .slice(0,8).map(function(x){ return x.p; });
}
function drawSuggestions(){
  var box=$("projList"), q=$("sProj").value;
  if(draft.proj&&q===draft.proj){ box.classList.add("hidden"); $("sProj").classList.add("picked"); return; }
  $("sProj").classList.remove("picked");
  var list=matches(q);
  if(!q.trim()){ box.classList.add("hidden"); box.innerHTML=""; return; }
  if(!list.length){
    box.innerHTML='<button type="button" disabled><small>No client matches &ldquo;'+esc(q)+'&rdquo;</small></button>';
    box.classList.remove("hidden"); return;
  }
  box.innerHTML=list.map(function(p){
    return '<button type="button" data-p="'+esc(p.p)+'">'+esc(p.p)+(p.g==="old"?' <small>(older)</small>':"")+'</button>';
  }).join("");
  box.classList.remove("hidden");
  Array.prototype.forEach.call(box.querySelectorAll("button[data-p]"),function(b){
    /* mousedown/touch fires before the box loses focus, so the pick is never lost to a blur */
    b.onmousedown=function(e){ e.preventDefault(); };
    b.onclick=function(){ pickProject(b.getAttribute("data-p")); };
  });
}
function pickProject(p){
  draft.proj=p; $("sProj").value=p;
  drawSuggestions(); drawVehicles(); drawLastKm();
  if(!draft.veh) return;
  $("sNotes").focus();
}

/* ---------------------------------------------------------------- vehicle */
function drawVehicles(){
  var host=$("vehChips");
  host.innerHTML=VEHICLES.map(function(v){
    return '<button type="button" class="chip'+(draft.veh===v?" on":"")+'" data-v="'+esc(v)+'">'+esc(v)+'</button>';
  }).join("");
  Array.prototype.forEach.call(host.querySelectorAll(".chip"),function(b){
    b.onclick=function(){
      draft.veh=b.getAttribute("data-v");
      S.vehicle=draft.veh; save();
      drawVehicles(); drawLastKm();
    };
  });
}

/* ---------------------------------------------------------------- start trip */
function lastReading(veh){
  var best=(S.lastKm||{})[veh]||null;
  for(var i=S.trips.length-1;i>=0;i--){
    var t=S.trips[i];
    if(t.vehicle===veh&&t.end_km!==null&&t.end_km!==undefined&&t.start_km>0&&(!best||t.date>=best.date)){
      best={km:t.end_km,date:t.date}; break;
    }
  }
  return best;
}
function drawLastKm(){
  var b=$("useLastBtn"), last=draft.veh?lastReading(draft.veh):null;
  if(!last){ b.classList.add("hidden"); b.innerHTML=""; return; }
  b.innerHTML='Use last: '+fmtKm(last.km)+' km';   /* build 9: no date (Rory - the dash says it) */
  b.classList.remove("hidden");
  b.onclick=function(){ $("startKm").value=String(last.km); groupDigits($("startKm")); $("sEndKm").focus(); };
}

/* Thousands commas AS YOU TYPE (Rory, build 7): 276296 shows as 276,296. Only digits and one decimal
   point are kept; the caret stays after the same digit it was after. num() already ignores commas,
   so what is stored and synced is the plain number. */
function groupDigits(el){
  var v=el.value, caret=el.selectionStart==null?v.length:el.selectionStart;
  var before=v.slice(0,caret).replace(/[^0-9.]/g,"").length;
  var clean=v.replace(/[^0-9.]/g,"");
  var dot=clean.indexOf(".");
  if(dot>=0) clean=clean.slice(0,dot+1)+clean.slice(dot+1).replace(/\./g,"");
  var parts=clean.split("."), whole=parts[0].replace(/^0+(?=\d)/,"");
  var out=whole.replace(/\B(?=(\d{3})+(?!\d))/g,",")+(parts.length>1?"."+parts[1]:"");
  if(out===v) return;
  el.value=out;
  var seen=0, pos=0;
  while(pos<out.length&&seen<before){ if(/[0-9.]/.test(out[pos])) seen++; pos++; }
  try{ if(document.activeElement===el) el.setSelectionRange(pos,pos); }catch(e){}
}
document.addEventListener("input",function(e){
  var id=e.target&&e.target.id;
  if(id==="startKm"||id==="sEndKm"||id==="endKm"||id==="eStart"||id==="eEnd") groupDigits(e.target);
},true);
function drawDate(){
  var d=$("sDate").value||todayISO();
  var today=(d===todayISO());
  $("dateLine").innerHTML=(today?"Today, "+esc(dayName(d)):'<b>'+esc(dayName(d))+' ('+esc(d)+')</b>')+
    ' &middot; <a id="dateChange">'+(dateOpen?"done":"change date")+'</a>';
  $("sDate").classList.toggle("hidden",!dateOpen);
  $("dateChange").onclick=function(){
    if(dateOpen&&!validDate($("sDate").value)){ alert("The date has to be YYYY-MM-DD, e.g. "+todayISO()+"."); return; }
    dateOpen=!dateOpen; drawDate(); if(dateOpen) $("sDate").focus();
  };
}
function syncStartBtn(){
  var done=num($("sEndKm").value)!==null;
  $("startBtn").textContent=done?"Log trip":"Start trip";
}
function startTrip(){
  var kmv=num($("startKm").value);
  var env=num($("sEndKm").value);
  var typed=$("sProj").value.trim();
  if(!draft.proj||draft.proj!==typed){
    /* typed exactly, without tapping the suggestion, still counts */
    var exact=PROJECTS.filter(function(p){ return p.p.toLowerCase()===typed.toLowerCase(); })[0];
    draft.proj=exact?exact.p:"";
  }
  var problems=[];
  if(!draft.proj) problems.push("Pick the client from the list that appears as you type.");
  if(!draft.veh)  problems.push("Pick the vehicle.");
  if(kmv===null) problems.push("Enter the start odometer reading. A vehicle with no odometer: enter 0 here and the trip distance as the end reading.");
  else if(isNaN(kmv)) problems.push("The start odometer is not a number.");
  else if(kmv<0) problems.push("An odometer reading cannot be negative.");
  if(env!==null){
    if(isNaN(env)) problems.push("The end odometer is not a number.");
    else if(env<0) problems.push("An odometer reading cannot be negative.");
    else if(kmv!==null&&!isNaN(kmv)){
      if(env<kmv) problems.push("The end reading ("+fmtKm(env)+" km) is lower than the start ("+
        fmtKm(kmv)+" km). A trip cannot run the odometer backwards - check which reading is which.");
      else if(env===kmv) problems.push("Start and end are identical, so the trip is 0 km. "+
        "The office refuses a 0 km trip.");
    }
  }
  var date=$("sDate").value||todayISO();
  if(!validDate(date)) problems.push("The date has to be YYYY-MM-DD, e.g. "+todayISO()+".");
  if(problems.length){ alert(problems.join("\n\n")); return; }
  if(env!==null&&env-kmv>2000&&
     !confirm(fmtKm(env-kmv)+" km in a single trip is unusually long.\n\nSave it anyway?")) return;

  S.seq=(S.seq||0)+1;
  var who=AUTH.signedIn()?AUTH.who():null;
  var t={
    id:date.replace(/-/g,"")+"-"+String(S.seq),
    date:date,
    driver:(S.driver||(who&&who.name)||"").trim(),
    vehicle:draft.veh,
    project:draft.proj,
    notes:$("sNotes").value.trim(),
    mode:"odo",
    start_km:kmv,
    end_km:env,
    startedAt:nowISO(),
    endedAt:(env!==null?nowISO():null),
    build:BUILD,
    sent:false, sentAt:null,
    hasStartPhoto:false, hasEndPhoto:false,
    uid:newUid(4), rev:1, syncRev:0
  };
  if(draft.photo){ t.hasStartPhoto=putPhoto(t.id,"start",draft.photo); }
  if(draft.endPhoto){ t.hasEndPhoto=putPhoto(t.id,"end",draft.endPhoto); }

  S.trips.push(t);
  S.vehicle=draft.veh;
  save(true);

  draft.photo=null; draft.endPhoto=null; draft.proj="";
  $("sProj").value=""; $("startKm").value=""; $("sEndKm").value=""; $("sNotes").value="";
  $("sDate").value=""; dateOpen=false;
  showShot($("startShot"),null); showShot($("sEndShot"),null);
  syncStartBtn(); drawSuggestions();
  render();
  SYNC.soon();
  window.scrollTo(0,0);
}

/* ---------------------------------------------------------------- open trip */
function openTrip(){
  for(var i=0;i<S.trips.length;i++){
    var t=S.trips[i];
    if(t.end_km===null||t.end_km===undefined) return t;
  }
  return null;
}
function drawOpen(){
  var t=openTrip();
  if(!t){
    $("openCard").className="card live hidden";
    $("startCard").className="card";
    $("noStart").className="hidden";
    return;
  }
  /* Only one trip can be open at a time. That is the forcing function that stops an
     unclosed trip piling up behind three new ones. */
  $("openCard").className="card live";
  $("startCard").className="card hidden";
  $("noStart").className="card";

  var started=t.startedAt?t.startedAt.slice(11,16):"";
  $("openHead").innerHTML=
    '<div style="font-size:17px;font-weight:800">'+esc(t.project)+'</div>'+
    '<div class="hint" style="margin-top:4px">'+esc(t.vehicle)+
      (t.driver?' &middot; '+esc(t.driver):'')+' &middot; '+dayName(t.date)+
      (started?' &middot; started '+started:'')+'</div>'+
    '<div class="hint" style="margin-top:6px">Start odometer <b>'+fmtKm(t.start_km)+' km</b>'+
      '</div>';

  $("oNotes").value=t.notes||"";
  var ep=getPhoto(t.id,"end");
  endPhoto=ep;
  showShot($("endShot"),ep,"End odometer",function(){
    endPhoto=null; dropPhoto(t.id,"end"); showShot($("endShot"),null);
  });
  drawOpenDist();
}
function drawOpenDist(){
  var t=openTrip(); if(!t) return;
  var v=num($("endKm").value);
  var box=$("oDist"), hint=$("oDistHint");
  if(v===null||isNaN(v)){
    box.className="dist"; box.querySelector(".v").innerHTML="&mdash;";
    hint.textContent="Read the odometer when you park.";
    return;
  }
  var d=v-t.start_km;
  if(d<0){
    box.className="dist bad"; box.querySelector(".v").textContent=fmtKm(d);
    hint.textContent="The end reading is lower than the start ("+fmtKm(t.start_km)+
      " km). A trip cannot run the odometer backwards - check which reading is which.";
  }else if(d===0){
    box.className="dist bad"; box.querySelector(".v").textContent="0";
    hint.textContent="Start and end are identical, so the trip is 0 km. The office refuses a "+
      "0 km trip - enter the real end-of-trip reading.";
  }else{
    box.className="dist"; box.querySelector(".v").textContent=fmtKm(d);
    hint.textContent=(d>2000?"That is an unusually long single trip - check the readings.":
      "From "+fmtKm(t.start_km)+" km to "+fmtKm(v)+" km.");
  }
}
function endTrip(){
  var t=openTrip(); if(!t) return;
  var v=num($("endKm").value);
  if(v===null){ alert("Enter the end odometer reading."); return; }
  if(isNaN(v)){ alert("The end odometer is not a number."); return; }
  if(v<0){ alert("An odometer reading cannot be negative."); return; }
  if(v<t.start_km){
    alert("The end reading ("+fmtKm(v)+" km) is lower than the start ("+fmtKm(t.start_km)+
          " km).\n\nA trip cannot run the odometer backwards - check which reading is which.");
    return;
  }
  if(v===t.start_km){
    alert("Start and end are identical, so the trip is 0 km.\n\n"+
          "Enter the real end-of-trip odometer reading.");
    return;
  }
  if(v-t.start_km>2000&&!confirm(fmtKm(v-t.start_km)+" km in a single trip is unusually long.\n\n"+
      "Save it anyway?")) return;

  t.notes=$("oNotes").value.trim();
  t.end_km=v;
  t.endedAt=nowISO();
  if(endPhoto){ t.hasEndPhoto=putPhoto(t.id,"end",endPhoto); }
  endPhoto=null;
  touch(t);
  $("endKm").value="";
  showShot($("endShot"),null);
  save(true);
  render();
  SYNC.soon();
  window.scrollTo(0,0);
}

function tripKm(t){
  if(t.end_km===null||t.end_km===undefined) return null;
  return t.end_km-t.start_km;
}

/* ---------------------------------------------------------------- waiting + sent
   The phone shows only what still needs it: closed trips not yet at the office, with the
   reason, and a short line of what was sent. */
function drawWaiting(){
  var signed=AUTH.signedIn();
  var wait=S.trips.filter(function(t){ return t.end_km!==null&&t.end_km!==undefined; });
  $("waitBox").classList.toggle("hidden",!wait.length);
  $("waitList").innerHTML=wait.map(function(t){
    var why=!HOSTED?"":(!signed?"waiting for you to sign in":(t.syncErr?"Sync failed: "+t.syncErr:
            (!navigator.onLine?"waiting for signal":"sending&hellip;")));
    return '<div class="row" data-id="'+esc(t.id)+'"><div class="m">'+esc(dayName(t.date))+' &middot; '+esc(t.project)+
      '<span class="why'+(t.syncErr&&signed?" bad":"")+'">'+(t.syncErr&&signed?why:why)+'</span></div>'+
      '<span class="k">'+fmtKm(tripKm(t))+' km</span>'+
      '<span class="act"><button type="button" data-act="edit">Edit</button>'+
      '<button type="button" class="danger" data-act="del">Delete</button></span></div>';
  }).join("");
  Array.prototype.forEach.call($("waitList").querySelectorAll("button[data-act]"),function(b){
    b.onclick=function(){
      var id=b.parentNode.parentNode.getAttribute("data-id");
      if(b.getAttribute("data-act")==="edit") editTrip(id); else delTrip(id);
    };
  });
}
function drawRecent(){
  var r=(S.recent||[]).slice(0,3);
  $("recentBox").classList.toggle("hidden",!r.length);
  $("recent").innerHTML=r.map(function(x){
    return '<div class="row"><div class="m"><span class="ok-ink">&#10003;</span> '+esc(dayName(x.date))+' &middot; '+
      esc(x.project)+'</div><span class="k">'+fmtKm(x.km)+' km</span></div>';
  }).join("");
}

function findTrip(id){
  for(var i=0;i<S.trips.length;i++) if(S.trips[i].id===id) return S.trips[i];
  return null;
}
function delTrip(id){
  var t=findTrip(id); if(!t) return;
  if(!confirm("Delete this trip?\n\n"+t.date+" - "+t.project+"\n"+
      (tripKm(t)===null?"open":fmtKm(tripKm(t))+" km")+
      (t.sent?"\n\nIt has already been sent to the office, so deleting it here does not "+
              "remove it there.":"\n\nIt has NOT been sent. This cannot be undone."))) return;
  /* A trip can be at the office even when the phone never heard back (the reply was
     lost to no signal), so once this phone has EVER signed in, every delete leaves a
     tombstone. One that finds no office row is simply dropped (review, 2026-11-12). */
  if(HOSTED&&(t.spId||(t.syncRev||0)>0||SYNC.busy()||AUTH.signedIn()||S.everSignedIn)){
    S.tombs=S.tombs||[];
    S.tombs.push({tid:SYNC.tripId(t),spId:t.spId||null,rev:(t.rev||1)+1,date:t.date,project:t.project});
  }
  dropPhoto(id,"start"); dropPhoto(id,"end");
  S.trips=S.trips.filter(function(x){ return x.id!==id; });
  save(true); render(); SYNC.soon();
}

/* ---------------------------------------------------------------- edit dialog */
function editTrip(id){
  var t=findTrip(id); if(!t) return;
  var dlg=$("dlg");
  $("dlgTitle").textContent="Edit trip - "+dayName(t.date);
  var opts=PROJECTS.map(function(p){
    return '<option value="'+esc(p.p)+'"'+(p.p===t.project?" selected":"")+'>'+esc(p.p)+'</option>';
  }).join("");
  var vopts=VEHICLES.map(function(v){
    return '<option value="'+esc(v)+'"'+(v===t.vehicle?" selected":"")+'>'+esc(v)+'</option>';
  }).join("");
  $("dlgBody").innerHTML=
    '<div class="f"><label>Date (YYYY-MM-DD)</label><input type="text" id="eDate" class="mono" inputmode="numeric" value="'+esc(t.date)+'"></div>'+
    '<div class="f"><label>Client / project</label><select id="eProj">'+opts+'</select></div>'+
    '<div class="f"><label>Vehicle</label><select id="eVeh">'+vopts+'</select></div>'+
    '<div class="f"><label>Sites / notes</label><textarea id="eNotes">'+esc(t.notes||"")+'</textarea></div>'+
    '<div class="row"><div><label>Start odometer</label>'+
      '<input type="text" id="eStart" inputmode="decimal" value="'+esc(t.start_km)+'"></div>'+
      '<div><label>End odometer</label>'+
      '<input type="text" id="eEnd" inputmode="decimal" value="'+
        esc(t.end_km===null||t.end_km===undefined?"":t.end_km)+'"></div></div>'+
    '<p class="hint">Leave the end blank to put the trip back in progress. Clearing a reading '+
      'never saves it as zero.</p>';
  ["eStart","eEnd"].forEach(function(id){ var el=$(id); if(el) groupDigits(el); });
  dlg.returnValue="";
  $("dlgOk").onclick=function(){
    var st=num($("eStart").value), en=num($("eEnd").value);
    if(st===null||isNaN(st)||st<0){
      alert("The start reading has to be a number of km, not blank. Nothing is saved as zero.");
      return;
    }
    if(en!==null){
      if(isNaN(en)||en<0){ alert("The end reading has to be a number of km."); return; }
      if(en<st){ alert("The end reading is lower than the start. A trip cannot run the "+
                       "odometer backwards."); return; }
      if(en===st){ alert("Start and end are identical, so the trip is 0 km. The office "+
                         "refuses a 0 km trip."); return; }
    }
    if(!validDate($("eDate").value)){ alert("The date has to be YYYY-MM-DD, e.g. "+todayISO()+"."); return; }
    t.date=$("eDate").value;
    t.project=$("eProj").value;
    t.vehicle=$("eVeh").value;
    t.notes=$("eNotes").value.trim();
    t.start_km=st;
    t.end_km=en;
    if(en===null) t.endedAt=null;
    else if(!t.endedAt) t.endedAt=nowISO();
    if(t.sent){
      t.sent=false; t.sentAt=null;
      if(!AUTH.signedIn()) banner("warn","Edited after sending",
        "This trip was marked unsent again so the correction reaches the office. Send your trips.");
    }
    touch(t);
    save(true); dlg.close(); render(); SYNC.soon();
  };
  $("dlgCancel").onclick=function(){ dlg.close(); };
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}

/* ---------- installable app layer ----------
   Copied from the Field Sheet app (build 13). Only on the hosted origin (or
   localhost while testing). A sent batch opened as a record, and a copy opened
   from file://, skip this entirely - the file stays plain self-contained HTML
   everywhere it always worked. */
var HOSTED=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
var STANDALONE=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var deferredInstall=null;

function showInstallUI(){
  if(STANDALONE) return;
  var b=$("installBanner"); if(!b) return;
  $("installMsg").innerHTML=IOS
    ? "Install before logging trips: tap <b>Share</b>, then <b>Add to Home Screen</b>. Trips typed in this tab will NOT follow into the installed app &mdash; <b>Send</b> any trips here first."
    : (deferredInstall
       ? "Put this on the home screen so it opens from an icon and works with no signal."
       : "Put this on the home screen: Chrome menu &#8942; &rarr; <b>Add to Home screen</b>. It then opens from an icon and works with no signal.");
  $("installBtn").classList.toggle("hidden",IOS||!deferredInstall);
  b.classList.remove("hidden");
}
function setupApp(){
  if(!HOSTED||RECORD) return;
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* a NEW worker reaching "activated" while an OLD one was already active
         is the one true signal of an update - survives hard reloads, where
         navigator.serviceWorker.controller is null despite an active worker */
      function offerWhenActivated(w){
        if(!w) return;
        w.addEventListener("statechange",function(){
          if(w.state==="activated") $("updatePill").classList.remove("hidden");
        });
      }
      if(reg.waiting&&reg.active) $("updatePill").classList.remove("hidden");
      reg.addEventListener("updatefound",function(){
        if(reg.active) offerWhenActivated(reg.installing);
      });
    }).catch(function(){});
  }
  /* the trip log must survive the OS cleaning house - installed apps are
     usually granted this automatically, but ask rather than assume */
  if(navigator.storage&&navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();
    deferredInstall=e;
    showInstallUI();
  });
  window.addEventListener("appinstalled",function(){
    deferredInstall=null;
    $("installBanner").classList.add("hidden");
  });
  $("installBtn").addEventListener("click",function(){
    if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; $("installBtn").classList.add("hidden"); }
  });
  $("updatePill").addEventListener("click",function(){
    save(true);
    location.reload();
  });
  /* the banner shows on EVERY platform until the app is actually installed -
     beforeinstallprompt upgrades it with a one-tap Install button when it fires */
  showInstallUI();
}

/* ---------------------------------------------------------------- render/boot */
function render(){
  drawBanners();
  drawOpen();
  drawVehicles();
  drawLastKm();
  drawDate();
  drawWaiting();
  drawRecent();
  drawSync();
}
function startSignIn(){
  var half=draft.proj&&($("startKm").value||$("sNotes").value);
  if(half&&!confirm("Signing in leaves this page for a moment, and the half-filled trip will be cleared.\n\nSign in now?")) return;
  save(true);
  AUTH.signIn();
}
function init(){
  $("buildBadge").textContent="build "+BUILD;
  probeStorage();
  S=load();
  if(NEEDS_SAVE){ NEEDS_SAVE=false; save(true); }   /* ids invented by load() are fixed for good, now */
  if(!S.lastKm) S.lastKm={};
  if(!Array.isArray(S.recent)) S.recent=[];
  retireSynced(); save(true);
  /* The installed app and a browser tab share this phone's storage but each keeps its
     own copy in memory. When the other one saves, take its copy (review, 2026-11-12). */
  window.addEventListener("storage",function(e){
    if(e.key!==STORE) return;
    S=load(); NEEDS_SAVE=false;
    render(); SYNC.soon();
  });
  draft.veh=S.vehicle||"";

  $("sProj").oninput=function(){ if($("sProj").value!==draft.proj) draft.proj=""; drawSuggestions(); };
  $("sProj").onkeydown=function(e){
    if(e.key==="Enter"){ var m=matches($("sProj").value); if(m.length){ e.preventDefault(); pickProject(m[0].p); } }
  };
  $("sProj").onblur=function(){ setTimeout(function(){ if(!draft.proj) $("projList").classList.add("hidden"); },150); };
  $("sProj").onfocus=function(){ drawSuggestions(); };
  $("sEndKm").oninput=syncStartBtn;
  $("sDate").oninput=function(){ if(validDate($("sDate").value)) drawDate(); };
  $("startBtn").onclick=startTrip;
  $("endBtn").onclick=endTrip;
  $("endKm").oninput=drawOpenDist;
  $("oNotes").oninput=function(){
    var t=openTrip(); if(!t) return;
    t.notes=$("oNotes").value; touch(t); save(); SYNC.soon();
  };
  $("editOpenBtn").onclick=function(){ var t=openTrip(); if(t) editTrip(t.id); };
  $("binOpenBtn").onclick=function(){ var t=openTrip(); if(t) delTrip(t.id); };
  /* build 7: no odometer photos (Rory). The sync engine still carries a photo if one exists on an older
     trip, so nothing already on a phone is lost. */

  syncStartBtn();
  render();
  setupApp();

  $("signInBtn").onclick=startSignIn;
  $("syncNowBtn").onclick=function(){ S.lastSyncErr=""; SYNC.run("button"); };
  $("signOutBtn").onclick=function(){
    var n=SYNC.pending();
    if(!confirm("Sign out of Microsoft on this phone?"+(n?"\n\n"+n+" trip"+(n>1?"s have":" has")+
      " not reached the office yet and will wait until someone signs in again.":""))) return;
    AUTH.signOut(); render();
  };
  if(HOSTED&&window.crypto&&crypto.subtle){
    AUTH.start().then(function(fresh){
      if(fresh&&!(S.driver||"").trim()&&fresh.name){ S.driver=fresh.name; save(true); }
    },function(e){
      banner("bad","Microsoft sign-in did not finish",esc(e.message||String(e)));
    }).then(function(){ render(); SYNC.run("boot"); });
    window.addEventListener("online",function(){ SYNC.run("online"); });
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) SYNC.run("visible"); });
    setInterval(function(){ SYNC.run("tick"); },120000);
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
